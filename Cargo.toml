[package]
name = "reformers"
version = "0.7.1"
edition = "2024"
default-run = "reformers"
license = "MIT"

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }

# gamepads; not on the web, where macroquad's JS loader can't host gilrs' wasm-bindgen
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs = "0.11.2"

# ponytail: the sim ports 32-bit asm that wraps everywhere; panicking on overflow would diverge from it.
[profile.dev]
overflow-checks = false

[build-dependencies]
winresource = "0.1.34"
